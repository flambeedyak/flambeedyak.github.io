<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>flambéed yak</title>
  <link rel="preload" href="assets/fonts/libre-baskerville-400.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: "Libre Baskerville";
      src: url("assets/fonts/libre-baskerville-400.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #0a1530;
      --fg: #f2ede3;
      --muted: #8a93ab;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12vh 16px 2rem;
      font-family: "Libre Baskerville", Baskerville, Georgia, "Times New Roman", serif;
      text-align: center;
    }

    h1 { margin: 0; }

    .logo {
      display: block;
      width: min(360px, 80vw);
      height: auto;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
    }

    footer {
      margin-top: auto;
      padding-top: 4rem;
      color: var(--muted);
      font-size: 0.85rem;
    }

    footer p { margin: 0; }

    footer .sep { margin: 0 0.3em; }

    footer .group { white-space: nowrap; }

    @media (max-width: 480px) {
      footer .group { display: block; }
      footer .group + .group { margin-top: 0.4rem; }
      footer .sep--group { display: none; }
    }

    footer a {
      color: inherit;
      text-underline-offset: 0.15em;
    }

    footer a:hover { color: var(--fg); }
  </style>
</head>
<body>
  <h1>
    <img class="logo" src="assets/logo.svg" alt="" width="304" height="147">
    <span class="visually-hidden">flambéed yak</span>
  </h1>
  <footer>
    <p><span class="group">Drew Robinson <a href="https://github.com/ocean">@ocean</a> 2026</span> <span class="sep sep--group" aria-hidden="true">&middot;</span> <span class="group"><a href="https://bsky.app/profile/drewr.dev">Bluesky</a> <span class="sep" aria-hidden="true">&middot;</span> <a href="https://mastodon.social/@ocean" rel="me">Mastodon</a></span></p>
  </footer>
  <a href="http://nymisoa.com/php/secondinvidious.php?topic_id=4675"><!-- crossgrained --></a>
</body>
</html>
